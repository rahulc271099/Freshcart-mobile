pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'com.freshcart.app'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-config is NOT picked up by the autolinkLibrariesFromCommand()
// call above — its own install docs still require this project to be
// registered manually (see node_modules/react-native-config/README.md,
// "Manual Link (Android)"), so that android/app/build.gradle's
// `apply from: project(':react-native-config')...dotenv.gradle` line has a
// project to resolve. Without this, the build fails with:
// "Project with path ':react-native-config' could not be found in project ':app'".
include ':react-native-config'
project(':react-native-config').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-config/android')
